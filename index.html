<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A real-time pocket-pet nursery game with WA native plants.">
<meta name="theme-color" content="#46733F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tubestock Pals">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Tubestock Pals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column — nursery bench scene on top, care console below, like a pocket pet held in the hand */
:root{
  --bg:#EDEFE4; --surface:#FBFBF5; --surface2:#E3E7D7; --ink:#20271E; --muted:#5F6A58; --line:#D3D8C6;
  --accent:#D49A12; --accent-ink:#2A1F04; --leaf:#46733F; --paw:#C2352B;
  --water:#2F7DBF; --food:#B07219; --happy:#C94585; --health:#3C8A4B;
  --warn-bg:#FBEBC8; --warn-ink:#6B4A05; --crit-bg:#F8DAD5; --crit-ink:#8A2318; --good-bg:#DCEBD5; --good-ink:#245A2C; --info-bg:#DDE8F2; --info-ink:#1D4A73;
  --shadow:0 1px 2px rgba(32,39,30,.07),0 4px 14px rgba(32,39,30,.07);
  --f-display:"Sniglet","Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141913; --surface:#1D231B; --surface2:#262E23; --ink:#E5EADD; --muted:#9BA691; --line:#323C2E;
  --accent:#E8B53A; --accent-ink:#231a03; --leaf:#86B67A; --paw:#E0624F;
  --water:#62A8E6; --food:#DB9B3E; --happy:#E77AAE; --health:#6BBE79;
  --warn-bg:#3A2F12; --warn-ink:#F1D486; --crit-bg:#45201B; --crit-ink:#F5ABA0; --good-bg:#203A22; --good-ink:#A9DDA9; --info-bg:#1B3044; --info-ink:#A8CDEE;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#141913; --surface:#1D231B; --surface2:#262E23; --ink:#E5EADD; --muted:#9BA691; --line:#323C2E;
  --accent:#E8B53A; --accent-ink:#231a03; --leaf:#86B67A; --paw:#E0624F;
  --water:#62A8E6; --food:#DB9B3E; --happy:#E77AAE; --health:#6BBE79;
  --warn-bg:#3A2F12; --warn-ink:#F1D486; --crit-bg:#45201B; --crit-ink:#F5ABA0; --good-bg:#203A22; --good-ink:#A9DDA9; --info-bg:#1B3044; --info-ink:#A8CDEE;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.45 var(--f-body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--water);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px;display:flex;flex-direction:column;gap:14px}

/* header */
.top{display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.25rem;white-space:nowrap;letter-spacing:.01em;flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.brand svg{width:28px;height:28px;flex:none}
.lv{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:92px}
.lv-pill{font-family:var(--f-display);font-weight:800;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 11px;font-size:.95rem}
.xpbar{width:92px;height:7px;border-radius:9px;background:var(--surface2);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--accent);border-radius:9px;transition:width .5s}
.xptext{font-size:.7rem;color:var(--muted)}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}

.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;min-height:40px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* pots */
.pots{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pots::-webkit-scrollbar{display:none}
.pot-tab{flex:1 0 auto;min-width:84px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left}
.pot-tab .n{font-weight:600;font-size:.9rem;white-space:nowrap}
.pot-tab .s{font-size:.72rem;color:var(--muted);white-space:nowrap}
.pot-tab[aria-pressed="true"]{border-color:var(--leaf);box-shadow:inset 0 0 0 1px var(--leaf)}
.pot-tab.alert .n::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--paw);margin-left:6px;vertical-align:1px}
.pot-tab:disabled{opacity:.55;cursor:default}

/* scene */
.scene{position:relative;border-radius:22px;overflow:hidden;box-shadow:var(--shadow);background:#9cc7e4;aspect-ratio:360/380;max-width:100%;touch-action:manipulation}
.scene canvas{display:block;width:100%;height:100%}
.chips{position:absolute;left:10px;right:10px;top:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:600;background:rgba(20,26,18,.55);color:#fff;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);white-space:nowrap}
.chip.sm{font-size:.7rem}

/* plant panel */
.panel{display:flex;flex-direction:column;gap:12px}
.ptitle{display:flex;align-items:flex-start;gap:10px}
.ptitle .names{flex:1;min-width:0}
.pname{font-family:var(--f-display);font-weight:800;font-size:1.6rem}
.psci{color:var(--muted);font-size:.88rem}
.psci i{font-style:italic}
.rar{font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;border-radius:999px;padding:3px 9px;white-space:nowrap;margin-top:6px}
.rar.common{background:var(--surface2);color:var(--muted)}
.rar.uncommon{background:var(--good-bg);color:var(--good-ink)}
.rar.rare{background:var(--info-bg);color:var(--info-ink)}
.rar.legendary{background:var(--warn-bg);color:var(--warn-ink)}
.stage{background:var(--surface);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.stage-row{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.stage-row b{font-weight:600}
.stage-row span{color:var(--muted);font-size:.8rem}
.steps{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.steps i{height:8px;border-radius:5px;background:var(--surface2);position:relative;overflow:hidden}
.steps i.done{background:var(--leaf)}
.steps i u{position:absolute;inset:0 auto 0 0;background:var(--leaf);opacity:.55;text-decoration:none}

.needs{display:flex;flex-wrap:wrap;gap:6px}
.need{font-size:.78rem;font-weight:600;border-radius:999px;padding:4px 10px}
.need.good{background:var(--good-bg);color:var(--good-ink)}
.need.warn{background:var(--warn-bg);color:var(--warn-ink)}
.need.crit{background:var(--crit-bg);color:var(--crit-ink)}
.need.info{background:var(--info-bg);color:var(--info-ink)}

.meters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px;background:var(--surface);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.meter{display:flex;flex-direction:column;gap:5px;min-width:0}
.meter .lab{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);font-weight:500}
.meter .lab b{color:var(--ink);font-weight:600}
.bar{height:10px;border-radius:6px;background:var(--surface2);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:6px;transition:width .6s}
.bar .band{position:absolute;top:0;bottom:0;border-left:2px solid var(--ink);border-right:2px solid var(--ink);opacity:.35}

.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.act{border:1px solid var(--line);background:var(--surface);border-radius:14px;min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:.8rem;font-weight:600;padding:6px 2px;box-shadow:var(--shadow);transition:transform .08s}
.act:active{transform:scale(.96)}
.act svg{width:26px;height:26px}
.act.hint{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.big{border:0;border-radius:14px;min-height:52px;padding:0 18px;font-weight:600;font-size:1rem;background:var(--leaf);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
:root[data-theme="dark"] .big{color:#10180e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .big{color:#10180e}}
.big.gold{background:var(--accent);color:var(--accent-ink)}
.big.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.big.danger{background:var(--crit-bg);color:var(--crit-ink)}

.away{background:var(--info-bg);color:var(--info-ink);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.away b{font-size:.95rem}
.away button{align-self:flex-start;border:0;background:none;padding:0;color:inherit;text-decoration:underline;font-weight:600;margin-top:2px}
.log{display:flex;flex-direction:column;gap:0;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.log h3{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 14px 4px;font-weight:600}
.log div{padding:7px 14px;border-top:1px solid var(--line);font-size:.85rem;display:flex;gap:10px}
.log div:first-of-type{border-top:0}
.log time{color:var(--muted);font-size:.75rem;min-width:52px;padding-top:1px}

/* picker */
.ph{display:flex;flex-direction:column;gap:4px}
.ph h2{font-family:var(--f-display);font-weight:800;font-size:1.35rem}
.ph p{margin:0;color:var(--muted);font-size:.9rem}
.plist{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.prow{display:flex;align-items:center;gap:12px;padding:8px 12px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;min-height:72px}
.prow:first-child{border-top:0}
.prow img{width:52px;height:56px;flex:none;border-radius:10px;background:var(--surface2)}
.prow .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.prow .c{font-weight:600}
.prow .sc{font-size:.8rem;color:var(--muted);font-style:italic}
.prow .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:.68rem;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--surface2);color:var(--muted)}
.prow.locked{opacity:.6;cursor:default}
.lockgroup{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 12px;background:var(--surface2)}

/* dex */
.dexhead{display:flex;justify-content:space-between;align-items:baseline}
.dexhead h2{font-family:var(--f-display);font-weight:800;font-size:1.35rem}
.dexhead span{color:var(--muted);font-size:.85rem}
.dex{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.dcard{border:0;background:var(--surface);border-radius:14px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--shadow);text-align:center;min-width:0}
.dcard img{width:100%;max-width:110px;aspect-ratio:12/13;border-radius:10px;background:var(--surface2)}
.dcard .no{font-size:.66rem;color:var(--muted);font-variant-numeric:tabular-nums}
.dcard .dn{font-size:.78rem;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.dcard .dg{font-size:.68rem;color:var(--leaf);font-weight:600}
.dcard.locked .dn{color:var(--muted)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,14,9,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;box-shadow:0 -8px 30px rgba(0,0,0,.2);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{font-family:var(--f-display);font-weight:800;font-size:1.45rem}
.sheet p{margin:0}
.sheet .x{align-self:flex-end;margin-bottom:-36px}
.card{background:var(--surface);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.card h3{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fact{background:var(--surface2);border-radius:10px;padding:8px 10px;min-width:0}
.fact .k{font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fact .v{font-weight:600;font-size:.88rem;overflow-wrap:anywhere}
.src{font-size:.75rem;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;font-weight:500;min-height:50px}
.opt.right{background:var(--good-bg);color:var(--good-ink);border-color:transparent}
.opt.wrong{background:var(--crit-bg);color:var(--crit-ink);border-color:transparent}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:.8rem;margin-top:2px}
.feedback{border-radius:12px;padding:10px 12px;font-size:.9rem}
.feedback.good{background:var(--good-bg);color:var(--good-ink)}
.feedback.bad{background:var(--warn-bg);color:var(--warn-ink)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
.field .row{display:flex;gap:8px}
.field input{flex:1;min-width:0;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font-size:1rem;color:var(--ink)}
.hero-img{display:flex;justify-content:center}
.hero-img img{width:150px;height:162px;border-radius:16px;background:var(--surface2)}
.help li{margin-bottom:6px}
.help ul{margin:0;padding-left:20px}
.lvbig{font-family:var(--f-display);font-weight:800;font-size:3rem;color:var(--accent);text-align:center;line-height:1}
.unlocks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;font-weight:500;z-index:60;max-width:min(92vw,460px);box-shadow:0 6px 20px rgba(0,0,0,.25);animation:up .2s ease-out}
.muted{color:var(--muted)}
.small{font-size:.82rem}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div class="wrap" id="app">
  <div class="top">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 17h16l-2 11H10z" fill="#B8643A"/><rect x="6.5" y="14.5" width="19" height="4" rx="1.5" fill="#CD7848"/><path d="M16 15c0-5 2-8 7-9-1 5-3 8-7 9zM16 15c0-4-2-6-6-7 0 4 2 6 6 7z" fill="#4E8A45"/></svg><span>Tubestock Pals</span></div>
    <div class="lv"><span class="lv-pill" id="lvPill">Lv 1</span><div class="xpbar"><i id="xpFill" style="width:0"></i></div><span class="xptext num" id="xpText">0 / 80 XP</span></div>
    <button class="iconbtn" id="menuBtn" aria-label="Help and settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.3a2.6 2.6 0 0 1 5 .9c0 1.8-2.5 2.2-2.5 3.8"/><circle cx="12" cy="17.3" r=".6" fill="currentColor"/></svg></button>
  </div>
  <div class="seg" role="group" aria-label="View">
    <button id="tabGarden" aria-pressed="true">Nursery bench</button>
    <button id="tabDex" aria-pressed="false">Plantdex</button>
  </div>
  <div id="viewGarden" style="display:flex;flex-direction:column;gap:14px">
    <div class="pots" id="pots"></div>
    <div class="scene" id="scene"><canvas id="cv" aria-label="Your plant on the nursery bench. Tap the plant to give it a pat, tap weeds and bugs to remove them."></canvas>
      <div class="chips"><span class="chip" id="chipLoc">Shade house</span><span class="chip" id="chipWx">Clear skies</span></div>
    </div>
    <div id="awayBox"></div>
    <div class="panel" id="panel"></div>
  </div>
  <div id="viewDex" hidden style="flex-direction:column;gap:14px"></div>
</div>
<div id="sheetRoot"></div>

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const $=id=>document.getElementById(id);
function rng32(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
const _rgb={};function rgb(h){if(_rgb[h])return _rgb[h];const n=parseInt(h.slice(1),16);return _rgb[h]=[n>>16&255,n>>8&255,n&255]}
function toHex(r,g,b){return'#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('')}
function mix(a,b,t){const A=rgb(a),B=rgb(b);return toHex(A[0]+(B[0]-A[0])*t,A[1]+(B[1]-A[1])*t,A[2]+(B[2]-A[2])*t)}
function shade(c,amt){return amt>=0?mix(c,'#ffffff',amt):mix(c,'#000000',-amt)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick=(arr,r=Math.random)=>arr[Math.floor(r()*arr.length)];
function shortSci(s){const p=s.split(' ');return p[0][0]+'. '+p.slice(1).join(' ')}
function seasonOf(ms){const m=new Date(ms).getMonth();return(m===11||m<2)?'summer':m<5?'autumn':m<8?'winter':'spring'}
function isNight(ms){const h=new Date(ms).getHours();return h>=21||h<6}
function weatherAt(ms){
  const B=3*3600e3, block=Math.floor(ms/B), start=block*B, s=seasonOf(start), h=new Date(start).getHours();
  const r=rng32(hashStr('wx'+block))()*100; let acc=0,key='clear';
  for(const [k,w] of WX_TABLE[s]){acc+=w;if(r<acc){key=k;break}}
  if(key==='doctor'&&!(h>=11&&h<20))key='clear';
  if(key==='easterly'&&!(h>=5&&h<13))key='clear';
  return Object.assign({key},WX[key]);
}
const xpFor=L=>40*L*(L-1);
function levelOf(x){let L=1;while(x>=xpFor(L+1))L++;return L}
const potsFor=L=>L>=9?4:L>=6?3:L>=3?2:1;
function fmtAgo(ms){const m=Math.round((Date.now()-ms)/60000);if(m<1)return'now';if(m<60)return m+'m';const h=Math.round(m/60);if(h<24)return h+'h';return Math.round(h/24)+'d'}
function fmtDur(ms){const h=ms/3.6e6;if(h<1)return Math.round(h*60)+' min';if(h<36)return (Math.round(h*10)/10)+' h';return Math.round(h/24*10)/10+' days'}
function factOf(sp,key){const f=(sp.g.facts||[]).find(x=>x[0]===key);return f?f[1]:null}

function fresh(){return{v:1,xp:0,pots:[null,null,null,null],dex:{},log:[],last:Date.now(),savedAt:0,daily:'',pats:{d:'',n:0},seenLv:1,intro:false}}
function migrate(s){if(!s||typeof s!=='object')return fresh();const f=fresh();for(const k in f)if(!(k in s))s[k]=f[k];while(s.pots.length<4)s.pots.push(null);return s}
function loadLocal(){try{const r=localStorage.getItem(LS);return r?JSON.parse(r):null}catch(e){return null}}

let cloudTimer=null;
function cloudSoon(){if(!cloud||cloudTimer)return;const wait=Math.max(1500,20000-(Date.now()-lastCloudWrite));cloudTimer=setTimeout(cloudFlush,wait)}
async function cloudFlush(){cloudTimer=null;if(!cloud||!dirty)return;dirty=false;lastCloudWrite=Date.now();
  try{await cloud.set({save:JSON.stringify(state),savedAt:state.savedAt})}
  catch(e){if(e&&(e.code==='invalid_argument'||e.code==='not_granted'||e.code==='revoked')){cloud=null;syncMode='device'}else{dirty=true}}}
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use)return;

function addLog(msg){state.log.unshift({t:Date.now(),m:msg});state.log.length=Math.min(state.log.length,40)}
function addXP(n,why){

// ================= SIMULATION =================
function newPlant(spId,name,quiz){
  const sp=SP[spId];
  return{sp:spId,name,stage:0,prog:0,water:55,food:60,happy:70,health:90,loc:'shade',weeds:[],bugs:[],wilted:false,born:Date.now(),seed:(Math.random()*2**31)|0,quiz,hard:false,pBurn:0};
}
function envAt(ms,companion){const wx=weatherAt(ms);return{season:seasonOf(ms),wx,night:isNight(ms),companion}}
function soggyAt(sp){return IDEAL[sp.t][1]+(sp.wet?14:25)}
function simPlant(p,dt,env,sum,potIdx){
  const sp=SP[p.sp],[lo,hi]=IDEAL[sp.t];
  let drain=(5+sp.t)*SEASON_DRAIN[env.season]*env.wx.drain*(env.night?.5:1)*(p.loc==='shade'?.85:1)*(p.stage<2&&p.loc==='sun'?1.25:1);
  p.water=clamp(p.water-drain*dt+env.wx.rain*dt,0,100);
  p.food=clamp(p.food-(.8+p.stage*.25+p.weeds.length*.5)*dt,0,100);
  p.happy=clamp(p.happy-(1.2+p.weeds.length*.8)*dt,0,100);
  let dmg=0,good=true;
  if(p.water<lo){dmg+=(lo-p.water)*.22+1;good=false}
  if(p.water>soggyAt(sp)){dmg+=sp.wet?5:2.5;good=false}
  if(p.food<15){dmg+=2;good=false}
  if(p.bugs.length){dmg+=p.bugs.length*1.2;good=false}
  if(p.loc==='sun'&&p.stage<2){dmg+=(env.season==='summer'||env.wx.key==='heat')?4:1.5;good=false}
  if(p.pBurn>Date.now())dmg+=.5;
  p.health=clamp(p.health+(good?3:0)*dt-dmg*dt,0,100);
  if(!p.wilted&&p.health<=0){p.wilted=true;p.prog=0;p.bugs=[];sum&&sum.ev.push(p.name+' wilted.');addLog(p.name+' wilted. Water and feed it to bring it back.')}
  if(p.wilted){if(good&&p.health>=35){p.wilted=false;sum&&sum.ev.push(p.name+' recovered.');addLog(p.name+' perked back up.')}else return}
  if(p.stage<5&&p.health>=40){
    let r=RATE[sp.rar]*(p.health/100)*SEASON_GROW[env.season];
    if(p.stage>=3&&p.loc==='shade')r*=.45;
    if(p.stage<2&&p.loc==='sun')r*=.6;
    if(p.happy<20)r*=.8;
    if(p.stage<2)r*=(DIFF[sp.g.diff]||1)*(p.quiz===true?1.25:p.quiz===false?.75:1);
    if(sp.host)r*=env.companion?1.15:.6;
    if(env.night)r*=.6;
    p.prog+=r*dt;
    if(p.prog>=100){p.prog=0;p.stage++;const gain=Math.round((20+10*p.stage)*RARMULT[sp.rar]);addXP(gain);const st=STAGES[sp.g.method][p.stage];addLog(p.name+' reached '+st.toLowerCase()+'. +'+gain+' XP');sum&&sum.ev.push(p.name+': '+st.toLowerCase());
      if(p.stage===5)state.dex[p.sp]=Object.assign({grown:0},state.dex[p.sp]||{},{bloomed:true});}
  }
  const rnd=Math.random;
  if(p.weeds.length<3&&rnd()<(p.loc==='sun'?.07:.04)*dt){p.weeds.push({x:Math.round((rnd()-.5)*84),k:rnd()<.5?0:1});sum&&sum.weeds++}
  if(p.stage>=2&&!p.wilted&&p.bugs.length<3&&rnd()<(env.season==='spring'?.045:.025)*dt){p.bugs.push({i:rnd(),ph:rnd()*6});sum&&sum.bugs++}
}
function tick(showAway){
  const now=Date.now(),STEP=10*60e3; let t=state.last||now;
  if(now-t>7*864e5)t=now-7*864e5;
  const elapsed=now-t; const sum={ev:[],weeds:0,bugs:0,rainH:0,heatH:0};
  while(t+STEP<=now){t+=STEP;
    const occupied=state.pots.filter(Boolean);
    state.pots.forEach((p,i)=>{if(!p)return;const companion=occupied.some(q=>q!==p&&!SP[q.sp].host);const env=envAt(t,companion);if(i===0||true){} simPlant(p,STEP/3.6e6,env,sum,i)});
    const wx=weatherAt(t);if(wx.rain)sum.rainH+=1/6;if(wx.key==='heat')sum.heatH+=1/6;
  }
  state.last=t;
  // daily check-in
  const today=new Date().toDateString();
  if(state.daily!==today){state.daily=today;if(state.intro){addXP(10);addLog('Morning check-in. +10 XP')}}
  if(showAway&&elapsed>45*60e3&&state.pots.some(Boolean)){awaySummary={ms:elapsed,...sum}}
  save();
}

function polar(x,y,a,l){return[x+Math.sin(a)*l,y-Math.cos(a)*l]}
const geoCache={};
function geoFor(spId,seed){const k=spId+':'+seed;return geoCache[k]||(geoCache[k]=genGeo(spId,seed))}
function genGeo(spId,seed){
  const v=SP[spId].v,R=rng32(seed),H=v.h;
  const g={stems:[],leaves:[],straps:[],blobs:[],flowers:[],fstems:[],trellis:0,trunk:null,crownY:0};
  const lc=()=>shade(v.leaf,(R()-.5)*.2);
  const leaf=(x,y,a,sc=1)=>g.leaves.push({x,y,a,l:v.ll*(.8+R()*.4)*sc,w:v.lw,c:lc(),s:v.ls});
  const flower=(x,y,a,sc=1)=>g.flowers.push({x,y,a,k:v.fk,c:v.fc,c2:v.fc2,s:v.fs*(.85+R()*.3)*sc,ph:R()*6});
  switch(v.arch){
  case'shrub':{
    const wood=v.wood||'#6b4f36',trunk=H*.16;g.stems.push({x1:0,y1:0,x2:0,y2:-trunk,w:5,c:wood});
    const tips=[];
    const br=(x,y,a,len,d)=>{const[x2,y2]=polar(x,y,a,len);g.stems.push({x1:x,y1:y,x2,y2,w:1+d*1.1,c:wood});
      const nl=Math.round(len/(v.ld||8));for(let i=0;i<nl;i++){const t=.2+R()*.8,sd=R()<.5?-1:1;leaf(x+(x2-x)*t,y+(y2-y)*t,a+sd*(.5+R()*.7))}
      if(d===0){tips.push({x:x2,y:y2,a});return}
      const n=2+(R()<(v.bushy||.35)?1:0);
      for(let i=0;i<n;i++){const na=clamp(a+(i-(n-1)/2)*(v.spread||.6)+(R()-.5)*.35,-1.4,1.4);br(x2,y2,na,len*(.64+R()*.16),d-1)}};
    const nb=3;for(let i=0;i<nb;i++)br(0,-trunk,(i-1)*.5+(R()-.5)*.2,H*.3,(v.depth||3)-1);
    tips.forEach(tp=>{for(let k=0;k<4;k++)leaf(tp.x,tp.y,tp.a+(R()-.5)*1.7);if(R()<(v.fd||.6))flower(tp.x,tp.y,tp.a)});
    break}
  case'cushion':{
    for(let i=0;i<95;i++){const a=R()*Math.PI,rr=Math.sqrt(R());const x=Math.cos(a)*rr*H*.72,y=-Math.sin(a)*rr*H*.62-4;g.blobs.push({x,y,r:5+R()*5,c:shade(v.leaf,(R()-.5)*.22)})}
    g.blobs.sort((a,b)=>a.y-b.y);
    for(let i=0;i<14;i++){const a=.15+R()*(Math.PI-.3),rr=.75+R()*.25;flower(Math.cos(a)*rr*H*.7,-Math.sin(a)*rr*H*.6-6,0)}
    break}
  case'runner':{
    const n=v.n||6;
    for(let i=0;i<n;i++){const sd=i%2?1:-1,reach=46+R()*26,lift=8+R()*14;
      const pts=[[sd*3,0],[sd*reach*.55,-lift],[sd*reach,2+R()*4],[sd*(reach+6+R()*6),24+R()*28]];
      for(let j=0;j<3;j++){const[a1,b1]=pts[j],[a2,b2]=pts[j+1];g.stems.push({x1:a1,y1:b1,x2:a2,y2:b2,w:3,c:v.stemC});
        const nl=v.ls==='fleshy'?4:5;for(let k=0;k<nl;k++){const t=(k+.5)/nl,x=a1+(a2-a1)*t,y=b1+(b2-b1)*t;
          if(v.ls==='fleshy'){leaf(x,y,sd*(.25+R()*.4)+(R()-.5)*.3)}else{leaf(x,y,(R()<.5?-1:1)*(1+R()*.6)+sd*.3)}}}
      if(R()<.8)flower(pts[1][0]+(pts[2][0]-pts[1][0])*.4,pts[1][1]-4,sd*.3);
      if(R()<.5)flower(pts[2][0],pts[2][1]-3,sd*.6);}
    for(let i=0;i<(v.upright||0);i++){const a=(R()-.5)*.9,len=18+R()*16,[x2,y2]=polar(0,0,a,len);g.stems.push({x1:0,y1:0,x2,y2,w:3,c:v.stemC});for(let k=0;k<3;k++)leaf(x2*(k/3),y2*(k/3)-3,a+(R()-.5)*.8);if(R()<.6)flower(x2,y2,a)}

    for(let i=0;i<n;i++){const a=(i/(n-1)-.5)*1.7+(R()-.5)*.15,len=H*(.45+R()*.35),bx=(R()-.5)*10,[ex,ey]=polar(bx,0,a*1.2,len),[cx,cy]=polar(bx,0,a*.45,len*.62);g.straps.push({x:bx,y:0,cx,cy,ex,ey,w:v.sw||5,c:lc()})}

      if(v.fk==='paw'){for(let k=0;k<4;k++){const t=.78+k*.07,x=x0+(ex-x0)*t,y=ey*t;flower(x,y,a+(k%2?.7:-.7))}}

      else flower(ex,ey,a)}
    break}
  case'climber':{
    g.trellis=H;let x=0,y=0,sd=1;const pts=[[0,0]];

      if(R()<.5){const sx=a2+(R()<.5?-1:1)*(18+R()*10);g.stems.push({x1:a2,y1:b2,x2:sx,y2:b2-6,w:1.6,c:v.stemC});leaf(sx,b2-6,sx>a2?1:-1)}

  case'grass':{
    const n=v.n||30;
    for(let i=0;i<n;i++){const a=(R()-.5)*2.7,len=H*(.35+R()*.4),bx=(R()-.5)*12,[ex,ey]=polar(bx,0,a*1.15,len),[cx,cy]=polar(bx,0,a*.35,len*.7);g.straps.push({x:bx,y:0,cx,cy,ex,ey,w:1.8,c:shade(v.leaf,(R()-.5)*.2)})}
    for(let i=0;i<3;i++){const a=(i-1)*.45+(R()-.5)*.2,len=H*(.75+R()*.2),[ex,ey]=polar(0,0,a,len);g.fstems.push({x1:0,y1:0,x2:ex,y2:ey,w:1.6,c:'#9aa27c'});flower(ex,ey,a)}

function drawPlantAt(spId,seed,stage,t,opts={}){

function skyColors(h,wx){
  const stops=[[0,'#0f1830','#1d2a4a'],[5,'#1a2240','#3a3a5e'],[6.2,'#f1a982','#f7d9a8'],[8,'#7db6dd','#cfe6ef'],[16.5,'#78b1db','#d2e6ee'],[18.3,'#e88a5a','#f5c98a'],[19.6,'#3a2f5e','#8a5a7a'],[21,'#111a33','#1f2b4c'],[24,'#0f1830','#1d2a4a']];
  let a=stops[0],b=stops[1];for(let i=0;i<stops.length-1;i++){if(h>=stops[i][0]&&h<stops[i+1][0]){a=stops[i];b=stops[i+1];break}}
  const f=(h-a[0])/(b[0]-a[0]);let top=mix(a[1],b[1],f),bot=mix(a[2],b[2],f);
  if(wx.key==='cloudy'||wx.key==='showers'){top=mix(top,'#8d969c',.45);bot=mix(bot,'#b7bcbd',.45)}
  if(wx.key==='front'){top=mix(top,'#59626a',.6);bot=mix(bot,'#8c9396',.6)}
  if(wx.key==='heat'){top=mix(top,'#e7b25f',.25);bot=mix(bot,'#f6dc9a',.35)}
  return[top,bot];
}

function moodOf(p,night){
  if(!p)return night?'sleep':'wait';
  const sp=SP[p.sp],[lo,hi]=IDEAL[sp.t];
  if(p.wilted)return'wilted';if(p.health<25)return'sick';
  if(p.water<lo)return'thirsty';if(p.water>soggyAt(sp))return'soggy';
  if(p.loc==='sun'&&p.stage<2)return'hot';
  if(p.food<20)return'hungry';if(p.bugs.length)return'itchy';
  if(night)return'sleep';if(p.stage===5)return'joy';
  return p.happy>55?'happy':'ok';
}
function drawFace(t,p,night){
  const mood=moodOf(p,night),fx=CX,fy=294;
  const blink=(t%4.2)<.12;
  ctx.save();ctx.translate(fx,fy);
  ctx.fillStyle='rgba(255,140,140,.45)';if(mood!=='wilted'&&mood!=='sick'){ctx.beginPath();ctx.ellipse(-24,8,6,3.5,0,0,7);ctx.ellipse(24,8,6,3.5,0,0,7);ctx.fill()}
  ctx.fillStyle='#24180f';ctx.strokeStyle='#24180f';ctx.lineWidth=2.4;ctx.lineCap='round';
  const eye=(x)=>{
    if(mood==='wilted'){ctx.beginPath();ctx.moveTo(x-4,-4);ctx.lineTo(x+4,4);ctx.moveTo(x+4,-4);ctx.lineTo(x-4,4);ctx.stroke();return}
    if(mood==='sleep'||mood==='wait'||blink){ctx.beginPath();ctx.arc(x,-1,4.5,.2,Math.PI-.2);ctx.stroke();return}
    if(mood==='joy'||mood==='happy'&&Math.sin(t*.7)>.6){ctx.beginPath();ctx.arc(x,2,5,Math.PI+.3,-.3);ctx.stroke();return}
    if(mood==='thirsty'||mood==='sick'||mood==='hot'){ctx.beginPath();ctx.ellipse(x,0,3.6,3.2,0,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(x-6,-6);ctx.lineTo(x+5,-4);ctx.stroke();return}
    ctx.beginPath();ctx.ellipse(x,0,4,5.2,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+1.3,-2,1.5,0,7);ctx.fill();ctx.fillStyle='#24180f'};
  eye(-14);eye(14);
  ctx.beginPath();
  switch(mood){
    case'joy':ctx.fillStyle='#7a2a22';ctx.arc(0,6,6,0,Math.PI);ctx.fill();break;
    case'happy':ctx.arc(0,5,5,.2,Math.PI-.2);ctx.stroke();break;
    case'ok':ctx.arc(0,6,3.5,.3,Math.PI-.3);ctx.stroke();break;
    case'thirsty':case'hot':ctx.moveTo(-6,10);for(let i=0;i<=6;i++)ctx.lineTo(-6+i*2,10+(i%2?-2:1));ctx.stroke();break;
    case'soggy':ctx.moveTo(-6,9);ctx.quadraticCurveTo(-3,6,0,9);ctx.quadraticCurveTo(3,12,6,9);ctx.stroke();break;
    case'hungry':ctx.ellipse(0,9,3,3.6,0,0,7);ctx.stroke();break;
    case'itchy':ctx.moveTo(-5,9);ctx.lineTo(5,8);ctx.stroke();break;
    case'sick':case'wilted':ctx.arc(0,13,5,Math.PI+.4,-.4);ctx.stroke();break;
    case'sleep':case'wait':ctx.ellipse(0,9,2.4,2,0,0,7);ctx.stroke();break;

  const order=['bug','weed','pat'];
  for(const ty of order){const h=hits.find(h=>h.type===ty&&Math.hypot(h.x-x,h.y-y)<h.r);if(!h)continue;
    if(!p){floatText('Plant something first',x,y);return}
    if(ty==='bug'){p.bugs=p.bugs.filter(b=>b!==h.b);for(let i=0;i<6;i++)particles.push({k:'conf',c:'#86b23a',x:h.x,y:h.y,vx:(Math.random()-.5)*3,vy:-Math.random()*2.5,g:.12,life:.8,max:.8});addXP(3,1);addLog('Picked a bug off '+p.name+'. +3 XP')}

});

// ================= ACTIONS =================
function cur(){return state.pots[sel]}
function doWater(){const p=cur();if(!p)return;const sp=SP[p.sp],[lo,hi]=IDEAL[sp.t];const before=p.water;p.water=clamp(p.water+32,0,100);
  for(let i=0;i<16;i++)particles.push({k:'drop',x:CX+(Math.random()-.5)*60,y:150+Math.random()*30,vx:0,vy:2+Math.random()*2,g:.15,life:.9,max:.9});
  if(before<lo+5){addXP(4,1);addLog('Watered '+p.name+'. +4 XP')}else addLog('Watered '+p.name+'.');
  if(p.water>soggyAt(sp))toast(sp.wet?'Too wet! '+sp.g.common+' rots in soggy soil. Let it dry out.':'That’s waterlogged. Let it dry back to the green band.');
  else if(p.water>hi)toast('Plenty of water now. It’s above the ideal band.');
  save();renderPanel()}
function doPat(){const p=cur();if(!p)return;p.happy=clamp(p.happy+10,0,100);for(let i=0;i<4;i++)particles.push({k:'heart',x:CX+(Math.random()-.5)*50,y:240,vx:(Math.random()-.5)*.6,vy:-1-Math.random(),life:1.3,max:1.3,s:7+Math.random()*4});
  const d=new Date().toDateString();if(state.pats.d!==d)state.pats={d,n:0};if(state.pats.n<12){state.pats.n++;addXP(1)}save();renderPanel()}
function doMove(){const p=cur();if(!p)return;const sp=SP[p.sp];p.loc=p.loc==='shade'?'sun':'shade';
  if(p.loc==='sun'){if(p.stage<2)toast((sp.g.method==='seed'?'Seedlings':sp.g.method==='division'?'Fresh divisions':'Fresh cuttings')+' scorch in full sun. Keep it in the shade house until it’s established.');
    else if(p.stage>=3&&!p.hard){p.hard=true;addXP(10,1);addLog(p.name+' was hardened off into full sun. +10 XP')}else addLog('Moved '+p.name+' into full sun.')}
  else addLog('Moved '+p.name+' into the shade house.');
  save();renderPanel()}
function doFeed(kind){const p=cur();if(!p)return;const sp=SP[p.sp];const low=p.food<40;
  if(kind==='native'){p.food=clamp(p.food+40,0,110);addLog('Fed '+p.name+' native slow-release.'+(low?' +4 XP':''))}
  if(kind==='seaweed'){p.food=clamp(p.food+15,0,110);p.happy=clamp(p.happy+10,0,100);p.health=clamp(p.health+5,0,100);addLog('Gave '+p.name+' seaweed tonic.'+(low?' +4 XP':''))}
  if(kind==='general'){p.food=clamp(p.food+50,0,110);if(sp.ps){p.health=clamp(p.health-35,0,100);p.pBurn=Date.now()+24*3.6e6;toast('Phosphorus burn! '+sp.g.common+' is a Proteaceae and can’t handle normal fertiliser. Stick to low-phosphorus natives food.');addLog(p.name+' got phosphorus burn from all-purpose fertiliser.');save();closeSheet();renderPanel();return}addLog('Fed '+p.name+' all-purpose fertiliser.')}
  if(p.food>100){p.health=clamp(p.health-10,0,100);p.food=100;toast('Overfed. Too much fertiliser burns the roots.')}
  else if(low)addXP(4,1);
  save();closeSheet();renderPanel()}
function doPlantOut(){const p=cur();if(!p||p.stage<5)return;const sp=SP[p.sp];const gain=Math.round(80*RARMULT[sp.rar]);
  state.dex[p.sp]=Object.assign({grown:0},state.dex[p.sp]||{});state.dex[p.sp].grown++;state.dex[p.sp].bloomed=true;
  for(let i=0;i<40;i++)particles.push({k:'conf',c:pick([sp.v.fc,'#F2C230','#ffffff',sp.v.leaf]),x:CX,y:200,vx:(Math.random()-.5)*7,vy:-Math.random()*6-1,g:.18,life:1.8,max:1.8});
  addLog(p.name+' the '+sp.g.common+' was planted out in the garden. +'+gain+' XP');state.pots[sel]=null;addXP(gain,1);toast(p.name+' is planted out. Added to your Plantdex.');save();renderAll()}

  if(p.wilted)out.push(['crit','Wilted. Water and feed to revive']);
  if(p.water<lo)out.push([p.water<lo-12?'crit':'warn','Thirsty']);
  else if(p.water>soggyAt(sp))out.push(['crit','Waterlogged']);
  else if(p.water>hi)out.push(['info','Damp']);
  if(p.food<25)out.push(['warn','Hungry']);
  if(p.loc==='sun'&&p.stage<2)out.push(['crit','Too much sun']);
  if(p.loc==='shade'&&p.stage>=3)out.push(['info','Ready to harden off in full sun']);
  if(p.weeds.length)out.push(['warn',p.weeds.length+(p.weeds.length>1?' weeds':' weed')+' in the pot']);
  if(p.bugs.length)out.push(['warn','Bugs on the leaves']);
  if(p.pBurn>Date.now())out.push(['crit','Phosphorus burn']);
  if(sp.host&&!state.pots.some(q=>q&&q!==p&&!SP[q.sp].host))out.push(['info','Lonely: grow a host plant in another pot']);
  if(p.stage===5)out.push(['good','In flower']);
  if(!out.length)out.push(['good',night()?'Sleeping soundly':'Happy and growing']);
  return out;
}
const night=()=>isNight(Date.now());
function meter(label,val,col,band){return`<div class="meter"><div class="lab"><span>${label}</span><b class="num">${Math.round(val)}</b></div><div class="bar">${band?`<span class="band" style="left:${band[0]}%;width:${band[1]-band[0]}%"></span>`:''}<i style="width:${clamp(val,0,100)}%;background:${col}"></i></div></div>`}

const thumbCache={};
function thumb(spId,sil){const k=spId+(sil?':s':'');if(thumbCache[k])return thumbCache[k];
  const c=document.createElement('canvas'),TW=240,TH=260;c.width=TW;c.height=TH;const c2=c.getContext('2d');
  const sp=SP[spId];const g=geoFor(spId,hashStr(spId));
  // compute bounds roughly by drawing into transform: fit plant height
  const hgt=sp.v.arch==='runner'?170:sp.v.arch==='cushion'?110:sp.v.h*(sp.v.arch==='strappy'?1.35:sp.v.arch==='climber'?1.05:1.1);
  const s=Math.min(1.6,(TH-60)/hgt);
  c2.fillStyle=sil?'rgba(0,0,0,0)':'rgba(0,0,0,0)';c2.clearRect(0,0,TW,TH);
  swapCtx(c2,()=>{const ps=scale;scale=1;ctx.save();ctx.translate(TW/2,TH-34);
    ctx.fillStyle=sil?'#8f9a86':POT_COLS[0];ctx.beginPath();ctx.moveTo(-34,2);ctx.lineTo(34,2);ctx.lineTo(26,34);ctx.lineTo(-26,34);ctx.fill();ctx.beginPath();ctx.roundRect(-38,-6,76,10,3);ctx.fill();
    ctx.scale(s,s);drawPlantAt(spId,hashStr(spId),5,0,{sil:sil?'#8f9a86':null,forceFull:true});ctx.restore();scale=ps});
  return thumbCache[k]=c.toDataURL();
}
function swapCtx(c2,fn){const old=ctx;ctx=c2;try{fn()}finally{ctx=old}}

  const news=SPECIES.filter(s=>s.lv>a&&s.lv<=b);const potNew=potsFor(b)>potsFor(a);

  for(let i=0;i<50;i++)particles.push({k:'conf',c:pick(['#F2C230','#C8302E','#3F9C3C','#8C79C6','#fff']),x:Math.random()*W,y:-10,vx:(Math.random()-.5)*2,vy:Math.random()*2,g:.06,life:2.6,max:2.6});

function quizFor(sp){
  const m=sp.g.method,R=Math.random;let q,correct,pool;
  if(m==='seed'){correct=factOf(sp,'Pre-treatment');q='What pre-treatment does '+sp.g.common+' seed need before sowing?';pool=[...new Set(SPECIES.map(s=>factOf(s,'Pre-treatment')).filter(Boolean))]}
  else if(m==='cuttings'){correct=factOf(sp,'Hormone (IBA)');q='How much rooting hormone do '+sp.g.common+' cuttings get?';pool=['Not needed','1.5–3 g/L IBA','3 g/L IBA','8 g/L IBA']}
  else{correct=factOf(sp,'Division size');q='How big should each '+sp.g.common+' division be?';pool=['A single leaf with no rhizome','3–4 shoots with rhizome','The whole clump, unsplit']}
  if(!correct)return null;
  const others=pool.filter(x=>x!==correct).sort(()=>R()-.5).slice(0,2);
  return{q,correct,opts:[correct,...others].sort(()=>R()-.5)};
}
function openPlanting(id){

   ${quiz?`<div class="card"><h3>Propagation check</h3><p>${esc(quiz.q)}</p><div class="opts">${quiz.opts.map((o,i)=>`<button class="opt${answered!==null?(o===quiz.correct?' right':answered===i?' wrong':''):''}" data-q="${i}" ${answered!==null?'disabled':''}>${esc(o)}</button>`).join('')}</div>
     ${answered!==null?`<div class="feedback ${quiz.opts[answered]===quiz.correct?'good':'bad'}">${quiz.opts[answered]===quiz.correct?'Correct! Early growth is 25% faster and you earn 10 XP.':'Not quite. The answer is “'+esc(quiz.correct)+'”. Early growth will be a bit slower.'}</div>`:''}</div>`:''}
   ${answered!==null||!quiz?`<div class="card"><h3>From your guide</h3>${factsHTML(sp)}</div>
   <div class="field"><label for="nameIn">Name your plant</label><div class="row"><input id="nameIn" maxlength="16" value="${esc(nm)}" autocomplete="off"><button class="iconbtn" id="reroll" aria-label="Suggest another name"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/></svg></button></div></div>
   <button class="big" id="doPlant">${sp.g.method==='seed'?'Sow it in the shade house':sp.g.method==='division'?'Pot up the division':'Strike the cutting'}</button>`:''}`;
  const bind=s=>{s.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheet);
    s.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{answered=+b.dataset.q;const sh=s.querySelector('.sheet');sh.innerHTML=render();bind(s)});
    if($('reroll'))$('reroll').onclick=()=>{$('nameIn').value=pick(NAMES)};
    if($('doPlant'))$('doPlant').onclick=()=>{const name=($('nameIn').value||nm).trim().slice(0,16)||nm;const ok=quiz?quiz.opts[answered]===quiz.correct:null;
      state.pots[sel]=newPlant(id,name,ok);state.intro=true;if(!state.daily)state.daily=new Date().toDateString();
      if(ok)addXP(10,1);addLog((sp.g.method==='seed'?'Sowed ':sp.g.method==='division'?'Potted up ':'Struck ')+name+' the '+sp.g.common+'.'+(ok?' +10 XP':''));
      save();closeSheet();renderAll();window.scrollTo({top:0,behavior:'smooth'})}};
  openSheet(render(),bind);
}

let simAt=0;
function loop(ts){const t=ts/1000;
  if(!document.hidden&&view==='garden'){try{drawScene(t)}catch(e){console.error(e)}}
  if(Date.now()-simAt>20000){simAt=Date.now();tick(false);if(view==='garden')renderPanel()}
  requestAnimationFrame(loop)}

function start(data){
  state=migrate((data&&data.state)||loadLocal()||fresh());
  tick(true);resize();renderAll();
  try{window.claude?.hot?.snapshot?.(()=>({state}))}catch(e){}
  simAt=Date.now();requestAnimationFrame(loop);
  initCloud();
}
